{% extends "base.html" %}

{% block title %}Register Student{% endblock %}
{% block header_title %}Register Student{% endblock %}

{% block content %}
<div class="container-fluid px-0">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header card-header-navy py-3">
                    <h5 class="mb-0 text-white">
                        <i class="bi bi-person-plus-fill me-2"></i>Register New Student
                    </h5>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('add_student') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                        <div class="mb-3">
                            <label for="name" class="form-label">Full Name <span class="text-danger">*</span></label>
                            <input 
                                type="text" 
                                class="form-control" 
                                id="name" 
                                name="name" 
                                placeholder="e.g. Ayusman Mohanty" 
                                value="{{ form_data.get('name', '') }}" 
                                maxlength="100" 
                                required
                            >
                            <div class="form-text">Student's registered full name.</div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                            <input 
                                type="email" 
                                class="form-control" 
                                id="email" 
                                name="email" 
                                placeholder="e.g. ayusman@example.com" 
                                value="{{ form_data.get('email', '') }}" 
                                maxlength="100" 
                                required
                            >
                            <div class="form-text">Must be unique for each student.</div>
                        </div>

                        <div class="mb-4">
                            <label for="phone" class="form-label">Phone Number</label>
                            <input 
                                type="text" 
                                class="form-control" 
                                id="phone" 
                                name="phone" 
                                placeholder="e.g. +91 9876543210" 
                                value="{{ form_data.get('phone', '') }}" 
                                maxlength="20"
                            >
                            <div class="form-text">Optional contact phone number.</div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 pt-2 border-top">
                            <a href="{{ url_for('students') }}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-1"></i>Cancel
                            </a>
                            <button type="submit" class="btn btn-primary-navy">
                                <i class="bi bi-check-circle me-1"></i>Register Student
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
